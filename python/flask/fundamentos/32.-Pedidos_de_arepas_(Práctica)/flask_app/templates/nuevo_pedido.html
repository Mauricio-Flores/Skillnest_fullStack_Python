<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <section class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h1 class="h2">Nuevo pedido</h1>
                        <p class="text-muted mb-4">Completa los datos del pedido.</p>

                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                            {% endfor %}
                        {% endwith %}

                        <form action="{{ url_for('crear_pedido') }}" method="post">
                            <div class="mb-3">
                                <label class="form-label" for="nombre">Nombre</label>
                                <input class="form-control" id="nombre" name="nombre" type="text" minlength="2" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="tipo_arepa">Tipo de arepa</label>
                                <input class="form-control" id="tipo_arepa" name="tipo_arepa" type="text" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="cantidad">Cantidad</label>
                                <input class="form-control" id="cantidad" name="cantidad" type="number" min="1" required>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-success" type="submit">Crear pedido</button>
                                <a class="btn btn-outline-secondary" href="{{ url_for('lista_pedidos') }}">Volver</a>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
