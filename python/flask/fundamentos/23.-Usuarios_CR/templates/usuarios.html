<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
</head>
<body>
    <h1>Usuarios registrados</h1>

    <a href="{{ url_for('formulario_usuario') }}">Nuevo usuario</a>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Nombre completo</th>
            <th>Email</th>
        </tr>

        {% for usuario in usuarios %}
        <tr>
            <td>{{ usuario.id }}</td>
            <td>{{ usuario.nombre }} {{ usuario.apellido }}</td>
            <td>{{ usuario.email }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
