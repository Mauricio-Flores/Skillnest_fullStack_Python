<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
</head>
<body>

<h1>Usuarios registrados</h1>

<a href="{{ url_for('nuevo_usuario') }}">Agregar usuario</a>

{% for usuario in usuarios %}
<p>
{{ usuario.nombre }} {{ usuario.apellido }}
<br>
{{ usuario.email }}
</p>
<hr>
{% endfor %}

</body>
</html>
