<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renderizar Juegos</title>
</head>

<body>
    <h1>Listado VideoJuegos</h1>
    <ul>
        {% for juego in juegos %}
        <li>
            {{ juego.nombre }}
            -
            {{ juego.plataforma }}
            -
            {{ juego.anio_lanzamiento}}
        </li>
        {% endfor %}
    </ul>
</body>

</html>
