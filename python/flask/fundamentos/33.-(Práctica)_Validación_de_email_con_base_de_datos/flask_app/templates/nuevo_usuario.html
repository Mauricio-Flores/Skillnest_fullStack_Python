<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="layout narrow-layout">
        <section class="panel form-panel">
            <p class="eyebrow">Nuevo registro</p>
            <h1>Crear usuario</h1>
            <p class="subtitle">Completa los datos para agregarlo al listado.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <p class="notice notice-{{ category }}" role="alert">{{ message }}</p>
                {% endfor %}
            {% endwith %}

            <form action="{{ url_for('crear_usuario') }}" method="post">
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" type="text" required>

                <label for="apellido">Apellido</label>
                <input id="apellido" name="apellido" type="text" required>

                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" required>

                <div class="actions">
                    <button class="button button-primary" type="submit">Crear</button>
                    <a class="button button-secondary" href="{{ url_for('usuarios') }}">Volver</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
