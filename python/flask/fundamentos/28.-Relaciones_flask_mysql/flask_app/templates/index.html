<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear Libro</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h1>Crear Libro</h1>
                <p class="text-muted">
                    Selecciona el autor al que pertenece.
                </p>
            </div>

            <div>
                <a href="{{ url_for('libros') }}" class="btn btn-outline-primary">
                    Ver libros
                </a>
                <a href="{{ url_for('autores') }}" class="btn btn-outline-secondary">
                    Autores
                </a>
            </div>

        </div>

        <!-- ==================================================
             FORMULARIO
        =================================================== -->

        <div class="form-card">

            <form action="{{ url_for('crear') }}" method="POST">

                <!-- TÍTULO -->
                <div class="mb-3">
                    <label for="titulo" class="form-label">Título</label>
                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        class="form-control"
                        maxlength="45"
                        required
                    >
                </div>

                <!-- GÉNERO -->
                <div class="mb-3">
                    <label for="genero" class="form-label">Género</label>
                    <input
                        type="text"
                        id="genero"
                        name="genero"
                        class="form-control"
                        maxlength="45"
                        required
                    >
                </div>

                <!-- EDITORIAL -->
                <div class="mb-3">
                    <label for="editorial" class="form-label">Editorial</label>
                    <input
                        type="text"
                        id="editorial"
                        name="editorial"
                        class="form-control"
                        maxlength="45"
                        required
                    >
                </div>

                <!-- AUTOR -->
                <div class="mb-4">
                    <label for="autor_id" class="form-label">Autor</label>
                    <select
                        id="autor_id"
                        name="autor_id"
                        class="form-select"
                        required
                    >
                        <option value="">Selecciona un autor</option>

                        {% for autor in todos_autores %}
                            <option value="{{ autor.id }}">
                                {{ autor.nombre }}
                            </option>
                        {% endfor %}

                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Crear Libro
                </button>

            </form>

        </div>

    </div>

</body>

</html>
