{% extends "base.html" %}

{% block title %}Registro | Cuentas seguras{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <section class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">Crear una cuenta</h1>
                <form action="/registrar" method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input class="form-control" id="nombre" name="nombre" type="text" autocomplete="given-name" minlength="2" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="apellido">Apellido</label>
                        <input class="form-control" id="apellido" name="apellido" type="text" autocomplete="family-name" minlength="2" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Contraseña</label>
                        <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                        <div class="form-text">Mínimo 8 caracteres.</div>
                    </div>
                    <button class="btn btn-success" type="submit">Crear usuario</button>
                    <a class="btn btn-outline-secondary" href="/">Volver</a>
                </form>
            </div>
        </section>
    </div>
</div>
{% endblock %}
