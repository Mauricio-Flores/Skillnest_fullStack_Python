<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Juego del Destino</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="page">
        <section class="card">
            <header class="card-header">
                <div class="symbol">D</div>
                <h1>El Juego del Destino</h1>
                <p>Descubre qué te depara el futuro</p>
            </header>

            <form action="{{ url_for('enviar') }}" method="POST" class="form">
                <div class="field">
                    <label for="nombre">Tu nombre</label>
                    <input type="text" id="nombre" name="nombre"
                           placeholder="Escribe tu nombre" required>
                </div>

                <div class="field">
                    <label for="edad">Tu edad</label>
                    <input type="number" id="edad" name="edad"
                           min="1" max="120" placeholder="Escribe tu edad" required>
                </div>

                <div class="field">
                    <label for="color">Tu color favorito</label>
                    <input type="text" id="color" name="color"
                           placeholder="Ej. azul, verde, morado..." required>
                    <small>Elige el color que más te representa.</small>
                </div>

                <div class="field">
                    <label for="animal">Tu animal favorito</label>
                    <input type="text" id="animal" name="animal"
                           placeholder="Ej. perro, gato, águila..." required>
                    <small>Puede ser cualquier animal.</small>
                </div>

                <div class="orb"></div>

                <button type="submit" class="button">
                    Revelar mi destino
                </button>
            </form>
        </section>
    </main>
</body>
</html>
