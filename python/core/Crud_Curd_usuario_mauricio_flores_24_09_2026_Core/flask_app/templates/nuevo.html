<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo usuario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="contenedor formulario">
        <h1>Nuevo usuario</h1>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('crear') }}" method="POST">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" maxlength="45" value="{{ datos.nombre if datos else '' }}" required>

            <label for="apellido">Apellido</label>
            <input id="apellido" name="apellido" type="text" maxlength="45" value="{{ datos.apellido if datos else '' }}" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" maxlength="45" value="{{ datos.email if datos else '' }}" required>

            <div class="acciones-formulario">
                <button type="submit">Crear</button>
                <a href="{{ url_for('usuarios') }}">Volver</a>
            </div>
        </form>
    </main>
</body>
</html>
